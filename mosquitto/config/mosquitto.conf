# Configuracao do broker Mosquitto (2.x)

# guarda mensagens retidas entre reinicios
persistence true
persistence_location /mosquitto/data/

# logs vao para a saida padrao
log_dest stdout

listener 1883

#exige login e senha para todos os clientes
allow_anonymous false
password_file /mosquitto/config/passwd

# cada usuario so le e publica nos topicos da sua funcao
acl_file /mosquitto/config/acl
